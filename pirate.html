<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pirate Empire — FunHub</title><link rel="stylesheet" href="style.css"></head><body class="game-body"><div class="game-shell"><div class="game-topbar"><a class="icon-btn" href="games.html">←</a><div class="game-title">PIRATE EMPIRE</div><div class="top-spacer"></div><div class="hud-mini"><div class="hud-chip">GOLD <b id="gold">320</b></div><div class="hud-chip">HULL <b id="hull">100</b></div><div class="hud-chip">CREW <b id="crew">8</b></div><div class="hud-chip">CARGO <b id="cargo">0/12</b></div></div><button class="icon-btn" id="fs">⛶</button></div><div class="game-map"><canvas id="map"></canvas><div class="map-ui"><button class="icon-btn back-btn" onclick="location.href='games.html'">←</button><div class="floating-panel"><h3 id="island">Open Sea</h3><div id="info" class="event-log">Sail with the arrow buttons or WASD. Discover islands and build your crew.</div></div><div class="control-dock"><div class="control-group"><button class="btn" id="north">▲ Sail</button><button class="btn" id="south">▼ Sail</button><button class="btn" id="west">◀ Sail</button><button class="btn" id="east">Sail ▶</button><button class="btn" id="trade">Trade</button><button class="btn" id="crewBtn">Crew</button><button class="btn" id="repair">Repair</button><button class="btn primary" id="explore">Explore</button></div></div><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="modal-card"><button class="icon-btn" id="close" style="float:right">×</button><h2 id="mt">Island</h2><div id="mb"></div></div></div></div></div></div><script src="pirate.js"></script></body></html>
