<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>World Conquest — FunHub</title><link rel="stylesheet" href="style.css"></head><body class="game-body"><div class="game-shell" id="app"><div class="game-topbar"><a class="icon-btn" href="games.html" title="Back">←</a><div class="game-title">WORLD CONQUEST</div><div class="top-spacer"></div><div class="hud-mini"><div class="hud-chip">DAY <b id="day">1</b></div><div class="hud-chip">GOLD <b id="gold">800</b></div><div class="hud-chip">FOOD <b id="food">600</b></div><div class="hud-chip">IRON <b id="iron">450</b></div><div class="hud-chip">POWER <b id="power">18</b></div></div><button class="icon-btn" id="fs">⛶</button></div><div class="game-map"><canvas id="map"></canvas><div class="map-ui"><button class="icon-btn back-btn" onclick="location.href='games.html'">←</button><div class="floating-panel"><h3 id="provinceName">Select a province</h3><div id="provinceInfo" class="event-log">Tap a province. Drag to pan and pinch/scroll to zoom.</div><div class="world-legend"><span><i class="legend-dot" style="background:#65d8a0"></i>You</span><span><i class="legend-dot" style="background:#e66b75"></i>AI</span><span><i class="legend-dot" style="background:#8894a8"></i>Neutral</span></div></div><div class="toast" id="toast"></div><div class="control-dock"><div class="control-group"><button class="btn" id="build">Build Industry</button><button class="btn" id="recruit">Recruit Army</button><button class="btn" id="attack">Launch Campaign</button><button class="btn" id="research">Research</button><button class="btn" id="diplomacy">Diplomacy</button><button class="btn primary" id="end">End Day</button></div></div><div class="modal" id="modal"><div class="modal-card"><button class="icon-btn" id="close" style="float:right">×</button><h2 id="modalTitle">Command</h2><div id="modalBody"></div></div></div></div></div></div><script src="conques
